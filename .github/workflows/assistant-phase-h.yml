name: Phase H - Assistant regression suite
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/services/Assistant**.php'
      - 'src/controllers/Assistant**.php'
      - 'public/assets/**/assistant*'
      - 'tests/assistant_phase_h.php'
      - 'tests/fixtures/assistant_school_questions.json'
      - 'docs/PHASE_H_TESTS_EVALUATION.md'
      - '.github/workflows/assistant-phase-h.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assistant-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: PHP syntax check (assistant components and test)
        run: |
          set -e
          find src/services src/controllers tests \\\n            \\( -type f -name 'Assistant*.php' -o -type f -name 'assistant_phase_h.php' \\) -print0 | xargs -0 -r -n1 php -l
      - name: Run corpus and execution-contract regression tests
        run: php tests/assistant_phase_h.php
