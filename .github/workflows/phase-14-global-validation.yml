name: Phase 14 - Global PHP and regression validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  global-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, curl, gd, intl
          coverage: none
      - name: Lint every tracked PHP file
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z -- '*.php' | xargs -0 -r -n1 php -l
      - name: Run all database-independent PHP smoke tests
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for test_file in tests/*.php; do
            # Runtime health checks require the developer's configured school DB;
            # keep that explicitly opt-in test out of the CI smoke suite.
            # These are explicit environment/architecture audits, not smoke tests:
            # the database check needs local credentials; the view inventory reports
            # debt intentionally deferred for the user's local recovery.
            if [[ "$test_file" == "tests/assistant_phase6.php" || "$test_file" == "tests/audit_view_sql_inventory.php" ]]; then
              echo "Deferred environment/architecture audit: $test_file"
              continue
            fi
            php "$test_file"
            count=$((count + 1))
          done
          echo "Executed $count PHP test scripts."
      - name: Report phase 12-13 known architecture debt
        shell: bash
        run: |
          echo "The Phase 14 report documents outstanding view/controller legacy boundaries."
          grep -nE 'non clôturée|non clôturé|reste à|restent à|\[ \]' docs/PHASE14_FINAL_VALIDATION.md

      - name: Report deferred Phase 2 view SQL inventory (informational)
        shell: bash
        run: |
          set +e
          php tests/audit_view_sql_inventory.php
          audit_status=$?
          set -e
          if [[ $audit_status -ne 0 ]]; then
            echo "::notice::Legacy SQL remains in views and is documented for local continuation; this report is non-blocking for this requested merge."
          fi
