name: Phase 11 - Cross-cutting MVC checks

on:
  push:
    branches: [refactor/phase-11-cross-cutting]
  pull_request:
    branches: [main]
    paths:
      - 'src/controllers/LogController.php'
      - 'src/services/LogService.php'
      - 'src/repositories/LogRepository.php'
      - 'tests/phase11_logs_mvc_smoke.php'
      - 'tests/phase11_document_security_smoke.php'
      - 'tests/documents_messages_notifications_service_smoke.php'
      - '.github/workflows/phase-11-cross-cutting.yml'

jobs:
  cross-cutting-mvc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: PHP syntax validation
        run: |
          set -e
          for file in src/controllers/LogController.php src/services/LogService.php src/repositories/LogRepository.php tests/phase11_logs_mvc_smoke.php tests/phase11_document_security_smoke.php tests/documents_messages_notifications_service_smoke.php; do
            php -l "$file"
          done
      - name: Activity log MVC boundary
        run: php tests/phase11_logs_mvc_smoke.php
      - name: Private document storage and upload security
        run: php tests/phase11_document_security_smoke.php
      - name: Existing document, message and notification service contracts
        run: php tests/documents_messages_notifications_service_smoke.php
